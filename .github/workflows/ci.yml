name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tutor
          POSTGRES_PASSWORD: tutor
          POSTGRES_DB: tutor_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tutor -d tutor_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
      - name: Install
        # В venv/, как локально: pyright ищет пакеты там (venv = "venv" в pyproject.toml)
        run: |
          python -m venv venv
          venv/bin/pip install -e ".[dev]"
      - name: Ruff
        run: venv/bin/ruff check . && venv/bin/ruff format --check .
      - name: Pyright
        run: venv/bin/pyright
      - name: Tests
        run: venv/bin/pytest -q
