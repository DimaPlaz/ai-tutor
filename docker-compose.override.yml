# Только для локальной разработки: Postgres и Redis доступны с хоста для pytest и alembic.
# На сервере не используется (там явно указываются -f docker-compose.yml -f docker-compose.prod.yml).
services:
  db:
    ports:
      - "127.0.0.1:5432:5432"
  redis:
    ports:
      - "127.0.0.1:6379:6379"
